<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — VietFarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 87.5%; }
  body {
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 23.75rem;
    background: #fff;
    border-radius: 1rem;
    padding: 2.5rem 2.25rem;
    box-shadow: 6px 6px 54px 0 rgba(0,0,0,.05);
  }

  .header {
    text-align: center;
    margin-bottom: 1.75rem;
  }
  .brand {
    font-size: 1.375rem;
    font-weight: 600;
    color: #059669;
    margin-bottom: 1rem;
    letter-spacing: -.01em;
  }
  .title {
    font-size: 1.5rem;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -.02em;
  }
  .subtitle {
    margin-top: .25rem;
    font-size: .875rem;
    color: rgba(15,23,42,.6);
  }

  .field { margin-bottom: 1rem; }
  .label {
    display: block;
    font-size: .875rem;
    font-weight: 500;
    color: #0f172a;
    margin-bottom: .375rem;
  }
  .input {
    width: 100%;
    height: 2.5rem;
    padding: 0 .75rem;
    border: 1px solid #e2e8f0;
    border-radius: .5rem;
    font-family: inherit;
    font-size: .9375rem;
    color: #0f172a;
    background: #fff;
    outline: none;
    transition: border-color .15s;
  }
  .input:focus { border-color: #059669; box-shadow: 0 0 0 3px #ecfdf5; }

  .input-password-wrap { position: relative; }
  .input-password-wrap .input { padding-right: 2.5rem; }
  .eye-btn {
    position: absolute;
    right: .625rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #94a3b8;
    display: grid;
    place-items: center;
    padding: .25rem;
  }

  .btn-primary {
    width: 100%;
    height: 2.5rem;
    background: #059669;
    color: #fff;
    border: none;
    border-radius: .5rem;
    font-family: inherit;
    font-size: .9375rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: .5rem;
    letter-spacing: .01em;
    transition: background .15s;
  }
  .btn-primary:hover { background: #047857; }

  .divider {
    display: flex;
    align-items: center;
    gap: .75rem;
    margin: 1.25rem 0;
    color: #94a3b8;
    font-size: .8125rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    border-top: 1px solid #e2e8f0;
  }

  .footer-note {
    text-align: center;
    font-size: .8125rem;
    color: rgba(15,23,42,.6);
    margin-top: 1.25rem;
  }
  .footer-note a { color: #059669; font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="brand">VietFarm</div>
      <h1 class="title">Welcome back</h1>
      <p class="subtitle">Sign in to your account to continue</p>
    </div>

    <div class="field">
      <label class="label">Username</label>
      <input class="input" type="text" value="admin" placeholder="Enter your username" />
    </div>

    <div class="field">
      <label class="label">Password</label>
      <div class="input-password-wrap">
        <input class="input" type="password" value="••••••••" placeholder="Enter your password" />
        <button class="eye-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn-primary">Sign In</button>

    <p class="footer-note">IoT Platform · PTIT © 2026</p>
  </div>
</body>
</html>
