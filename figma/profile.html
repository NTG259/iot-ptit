<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — VietFarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 87.5%; }
  body {
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    background: #f8fafc; color: #0f172a;
    -webkit-font-smoothing: antialiased;
    height: 100vh; overflow: hidden; display: flex;
  }

  /* ─── Sidebar ─── */
  .sidebar { width:16rem; height:100vh; flex-shrink:0; display:flex; flex-direction:column; padding:1.25rem 1rem 1rem; background:#fff; border-right:1px solid #e2e8f0; }
  .sidebar-logo { padding:0 .5rem 1.25rem; border-bottom:1px solid #e2e8f0; font-size:1.0625rem; font-weight:600; }
  .sidebar-logo span { color:#059669; }
  .nav { margin-top:1.5rem; display:flex; flex-direction:column; gap:.5rem; }
  .nav-item { display:flex; align-items:center; gap:1rem; padding:.625rem 1rem; border:1px solid transparent; border-radius:.5rem; font-size:.9375rem; color:rgba(15,23,42,.8); text-decoration:none; }
  .nav-item.active { background:#ecfdf5; border-color:#a7f3d0; color:#059669; font-weight:600; }
  .sidebar-user { margin-top:auto; padding-top:1rem; border-top:1px solid #e2e8f0; display:flex; align-items:center; gap:.25rem; }
  .user-link { min-width:0; flex:1; display:flex; align-items:center; gap:.75rem; padding:.5rem; border-radius:.5rem; text-decoration:none; background:#ecfdf5; border-radius:.5rem; }
  .avatar-sm { flex-shrink:0; width:2.5rem; height:2.5rem; border-radius:9999px; background:#059669; color:#fff; display:grid; place-items:center; font-size:.875rem; font-weight:600; }
  .user-text { min-width:0; flex:1; }
  .user-name { display:block; font-size:.875rem; font-weight:600; color:#0f172a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-uname { display:block; font-size:.75rem; color:#64748b; font-family:ui-monospace,monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .logout-btn { flex-shrink:0; width:2.5rem; height:2.5rem; border:0; border-radius:.5rem; background:transparent; color:#64748b; display:grid; place-items:center; cursor:pointer; }

  /* ─── Shell ─── */
  .shell-content { flex:1; min-width:0; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  .breadcrumb { height:3rem; flex-shrink:0; display:flex; align-items:center; padding:0 2rem; background:#fff; border-bottom:1px solid #e2e8f0; font-size:.875rem; letter-spacing:.1em; }
  .bc-root { font-weight:600; color:#059669; }
  .bc-sep { margin:0 .75rem; color:#cbd5e1; }
  .bc-page { color:#0f172a; text-transform:uppercase; }

  .main { flex:1; min-height:0; overflow-y:auto; padding:1rem 1.5rem; display:grid; place-items:center; }

  .panel { background:#fff; border:1px solid #e2e8f0; border-radius:.875rem; box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1); }

  /* ─── Profile card ─── */
  .profile-card {
    position: relative;
    width: 100%;
    max-width: 38rem;
    padding: 1.5rem 2rem;
  }

  .edit-btn {
    position: absolute; top: 1.25rem; right: 1.25rem;
    display: flex; align-items: center; gap: .375rem;
    height: 2rem; padding: 0 .75rem;
    border: 1px solid #e2e8f0; border-radius: .5rem;
    background: #fff; font-family: inherit; font-size: .875rem;
    color: #0f172a; cursor: pointer;
  }

  .profile-header { display: flex; flex-direction: column; align-items: center; text-align: center; }

  .avatar-lg {
    position: relative;
    display: grid; place-items: center;
    width: 5rem; height: 5rem;
    border: 2px solid #a7f3d0; border-radius: 9999px;
    background: #ecfdf5;
    font-size: 1.875rem; font-weight: 600; color: #059669;
  }

  .profile-name { margin-top: 1rem; font-size: 1.5rem; font-weight: 600; letter-spacing: -.02em; }
  .profile-role { margin-top: .5rem; font-size: 1.125rem; color: #475569; }
  .profile-school { margin-top: .5rem; display: flex; align-items: center; gap: .5rem; color: #64748b; font-size: .9375rem; }

  .divider { margin: 1.25rem 0; border-top: 1px solid #e2e8f0; }

  .fields { display: flex; flex-direction: column; gap: 1rem; }

  .copy-field {
    display: flex; align-items: center; gap: 1.25rem;
    padding: .75rem 1rem;
    border: 1px solid #e2e8f0; border-radius: .75rem;
    background: rgba(248,250,252,.6);
  }
  .copy-text { min-width: 0; flex: 1; }
  .copy-label {
    font-size: .875rem; letter-spacing: .12em; text-transform: uppercase;
    color: #94a3b8; font-variant-numeric: tabular-nums;
  }
  .copy-value { margin-top: .25rem; font-size: 1rem; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .copy-value-highlight { font-variant-numeric: tabular-nums; font-weight: 600; color: #059669; }
  .copy-btn { margin-left: auto; color: #94a3b8; background: none; border: none; cursor: pointer; display: grid; place-items: center; padding: .25rem; border-radius: .375rem; }

  .links { margin-top: 1.25rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
  .link-btn {
    height: 2.75rem; display: flex; align-items: center; justify-content: center; gap: .5rem;
    border: 1px solid #e2e8f0; border-radius: .5rem;
    background: rgba(248,250,252,.6); font-family: inherit;
    font-size: 1rem; font-weight: 500; color: #0f172a; text-decoration: none; cursor: pointer;
  }
</style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">Viet<span>Farm</span></div>
    <nav class="nav">
      <a href="#" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Dashboard
      </a>
      <a href="#" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/>
          <path d="M12 7v4M5 17l5-4M19 17l-5-4"/>
        </svg>
        Sensors
      </a>
      <a href="#" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 21h8M12 17v4M4 3h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
          <path d="M8 9h4M8 13h6"/>
        </svg>
        History
      </a>
    </nav>
    <div class="sidebar-user">
      <a href="#" class="user-link">
        <div class="avatar-sm">NC</div>
        <div class="user-text">
          <span class="user-name">Nguyễn Thành Công</span>
          <span class="user-uname">@admin</span>
        </div>
      </a>
      <button class="logout-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <div class="shell-content">
    <div class="breadcrumb">
      <span class="bc-root">SYSTEM</span>
      <span class="bc-sep">/</span>
      <span class="bc-page">Profile</span>
    </div>

    <div class="main">
      <div class="panel profile-card">
        <button class="edit-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Edit profile
        </button>

        <div class="profile-header">
          <div class="avatar-lg">NC</div>
          <h1 class="profile-name">Nguyễn Thành Công</h1>
          <p class="profile-role">Student</p>
          <div class="profile-school">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            Học viện Công nghệ Bưu chính Viễn thông
          </div>
        </div>

        <div class="divider"></div>

        <div class="fields">
          <div class="copy-field">
            <div class="copy-text">
              <div class="copy-label">Student ID</div>
              <div class="copy-value copy-value-highlight">B21DCCN259</div>
            </div>
            <button class="copy-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
          </div>

          <div class="copy-field">
            <div class="copy-text">
              <div class="copy-label">Email</div>
              <div class="copy-value">mambong2407@gmail.com</div>
            </div>
            <button class="copy-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
          </div>

          <div class="copy-field">
            <div class="copy-text">
              <div class="copy-label">Username</div>
              <div class="copy-value">admin</div>
            </div>
            <button class="copy-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="links">
          <a href="#" class="link-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            GitHub
          </a>
          <a href="#" class="link-btn" style="opacity:.5">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/>
              <path d="M12 8v8M8 12h8"/>
            </svg>
            Figma <span style="font-size:.75rem;color:#94a3b8">(not set)</span>
          </a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
